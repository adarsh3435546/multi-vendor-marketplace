# =============================================
# PRODUCTION CONFIG — Neon PostgreSQL Database
# =============================================

# Application
spring.application.name=multi-vendor-marketplace

# Server — use PORT env variable (for Render)
server.port=${PORT:8080}

# Neon PostgreSQL Database — set DATABASE_URL on Render as environment variable
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-round-thunder-b4if8t7o-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_4yMJfm9ildQg}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (optimized for Neon serverless)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Security
jwt.secret=${JWT_SECRET:marketplace_super_secret_jwt_signing_key_at_least_32_bytes_long_123456}
jwt.expiration=86400000

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret_placeholder}
